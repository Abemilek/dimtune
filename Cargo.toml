[package]
name = "dimtune"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "An ultra-minimal music player with a dark UI, no network, and no telemetry"
license = "MIT"
repository = "https://github.com/Abemilek/dimtune"
readme = "README.md"
keywords = ["music", "player", "audio", "egui", "minimal"]
categories = ["multimedia::audio"]

[dependencies]
# UI (pure Rust; Wayland and X11, OpenGL/glow rendering)
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Audio: rodio (cpal/ALSA -> PipeWire) with Symphonia decoders (pure Rust)
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
# Tags and embedded cover art
lofty = "0.25"
# Covers: JPEG and PNG only
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Native folder picker via xdg-desktop-portal
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
