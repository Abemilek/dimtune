name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release
        run: |
          set -euo pipefail
          name="dimtune-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/${name}"
          install -m755 target/release/dimtune "dist/${name}/dimtune"
          install -m644 README.md LICENSE dimtune.desktop dimtune.svg "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.sha256 \
              --title "dimtune ${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
